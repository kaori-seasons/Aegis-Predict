h="2" stroke-linejoin="round"/><polyline points="1028.5,535.0 1043.0,535.0 1043.0,625.0 1057.5,625.0" fill="none" stroke="#9ba4ae" stroke-width="2" stroke-linejoin="round"/><polyline points="1051.5323283455834,628.6588106025146 1057.5,625.0 1051.5323283455834,621.3411893974854" fill="none" stroke="#9ba4ae" stroke-width="2" stroke-linejoin="round"/><polyline points="1197.5,625.0 1212.0,625.0 1212.0,355.0 1226.5,355.0" fill="none" stroke="#9ba4ae" stroke-width="2" stroke-linejoin="round"/><polyline points="1220.5323283455834,358.6588106025146 1226.5,355.0 1220.5323283455834,351.3411893974854" fill="none" stroke="#9ba4ae" stroke-width="2" stroke-linejoin="round"/><polyline points="1366.5,355.0 1381.0,355.0 1381.0,445.0 1395.5,445.0" fill="none" stroke="#9ba4ae" stroke-width="2" stroke-linejoin="round"/><polyline points="1389.5323283455834,448.6588106025146 1395.5,445.0 1389.5323283455834,441.3411893974854" fill="none" stroke="#9ba4ae" stroke-width="2" stroke-linejoin="round"/><polyline points="1296.5,387.0 1296.5,700 282.5,700 282.5,387.0" fill="none" stroke="#626b75" stroke-width="2" stroke-linejoin="round"/><polyline points="286.1588106025146,392.96767165441656 282.5,387.0 278.8411893974854,392.96767165441656" fill="none" stroke="#626b75" stroke-width="2" stroke-linejoin="round"/><rect x="420" y="682" width="780" height="41" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="434" y="688" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="400" fill="#626b75">07 结算关闭后可开下一轮；08 独立等待实绩成熟</text><rect x="212.5" y="322.0" width="140.0" height="66.0" fill="#ffffff" stroke="#74808c" stroke-width="1"/><text x="223.5" y="332.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#20252b">连接与映射</text><text x="223.5" y="364.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#626b75">同步完整批次</text><rect x="381.5" y="322.0" width="140.0" height="66.0" fill="#ffffff" stroke="#74808c" stroke-width="1"/><text x="392.5" y="332.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#20252b">来源与对账</text><text x="392.5" y="364.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#626b75">差异先处置</text><rect x="550.5" y="412.0" width="140.0" height="66.0" fill="#ffffff" stroke="#74808c" stroke-width="1"/><text x="561.5" y="422.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#20252b">冻结预测</text><text x="561.5" y="454.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#626b75">并行均值基线</text><rect x="719.5" y="412.0" width="140.0" height="66.0" fill="#ffffff" stroke="#74808c" stroke-width="1"/><text x="730.5" y="422.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#20252b">保护期约束</text><text x="730.5" y="454.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#626b75">生成影子计划</text><rect x="888.5" y="502.0" width="140.0" height="66.0" fill="#ffffff" stroke="#74808c" stroke-width="1"/><text x="899.5" y="512.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#20252b">审核发布</text><text x="899.5" y="544.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#626b75">库存预占</text><rect x="1057.5" y="592.0" width="140.0" height="66.0" fill="#ffffff" stroke="#74808c" stroke-width="1"/><text x="1068.5" y="602.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#20252b">发运 / 收货</text><text x="1068.5" y="634.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#626b75">累计事实回读</text><rect x="1226.5" y="322.0" width="140.0" height="66.0" fill="#ffffff" stroke="#74808c" stroke-width="1"/><text x="1237.5" y="332.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#20252b">双端对账</text><text x="1237.5" y="364.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#626b75">结算后关闭</text><rect x="1395.5" y="412.0" width="140.0" height="66.0" fill="#ffffff" stroke="#74808c" stroke-width="1"/><text x="1406.5" y="422.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="400" fill="#20252b">成熟评分</text><text x="1406.5" y="454.0" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="400" fill="#626b75">校准 / FVA</text><polyline points="48,744 1552,744" fill="none" stroke="#20252b" stroke-width="1" stroke-linejoin="round"/><text x="48" y="770" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="35" font-weight="600" fill="#20252b">先完成数据与影子验证，再受控执行</text><text x="48" y="827" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#20252b">系统内：冻结事实、预测证据、人工审批、库存预占、对账和审计。</text><text x="48" y="875" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="27" font-weight="400" fill="#20252b">系统外：真实商家授权、仓内实物作业、订舱及运输由对应平台完成。</text><text x="48" y="946" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#235b91">作业顺序  01–04 准备与规划  /  05 审批发布  /  06–07 实物闭环  /  08 成熟复盘</text><text x="48" y="1000" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#996015">出现差异先修源数据；单据创建不等于发运完成；库存结算不等于财务结算。</text><polyline points="48,1092 1552,1092" fill="none" stroke="#d8dce0" stroke-width="1" stroke-linejoin="round"/><text x="48" y="1110" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#626b75">作业示意；默认 Mock / 影子。真实授权、执行开关、逐仓对账与模型验收需分别完成。</text></svg>