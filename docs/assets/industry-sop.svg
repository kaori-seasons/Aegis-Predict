<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc"><title id="title">电商、海外仓与物流端到端SOP</title><desc id="desc">八步岗位泳道：接入、核对、预测、补货、审核发布、发运收货、双端结算、成熟复盘。执行默认关闭；结算后可开启下一轮，独立成熟评分不阻塞业务。</desc><rect width="1600" height="1150" fill="white"/><text x="48" y="38" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="42" font-weight="600" fill="#20252b">电商、海外仓与物流的日常作业闭环</text><text x="48" y="102" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#626b75">需求与库存接入 → 预测与补货 → 审批与实物执行 → 双端结算与成熟复盘</text><text x="1405" y="50" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="28" font-weight="600" fill="#235b91">AEGIS</text><text x="48" y="157" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="600" fill="#20252b">电商 / 商贸</text><text x="48" y="196" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#626b75">需求、经营信号、上新事件与补货审批</text><polyline points="538,158 538,222" fill="none" stroke="#d8dce0" stroke-width="1" stroke-linejoin="round"/><text x="558" y="157" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="600" fill="#20252b">海外仓 / 3PL</text><text x="558" y="196" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#626b75">授权库存、发运收货与执行后快照</text><polyline points="1048,158 1048,222" fill="none" stroke="#d8dce0" stroke-width="1" stroke-linejoin="round"/><text x="1068" y="157" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="26" font-weight="600" fill="#20252b">货代 / 承运</text><text x="1068" y="196" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="400" fill="#626b75">外部完成运输，按约定回传执行证据</text><polyline points="48,245 1552,245" fill="none" stroke="#20252b" stroke-width="1" stroke-linejoin="round"/><text x="48" y="272" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="22" font-weight="400" fill="#626b75">岗位 / 交接</text><text x="227.5" y="264" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#20252b">01  接入</text><text x="396.5" y="264" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#20252b">02  核对</text><text x="565.5" y="264" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#20252b">03  预测</text><text x="734.5" y="264" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#20252b">04  补货</text><text x="903.5" y="264" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#20252b">05  发布</text><text x="1072.5" y="264" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#20252b">06  执行</text><text x="1241.5" y="264" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#20252b">07  结算</text><text x="1410.5" y="264" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" font-weight="400" fill="#20252b">08  复盘</text><rect x="48" y="310" width="1504" height="90" fill="#f7f8f9" stroke="#ffffff" stroke-width="1"/><text x="54" y="342" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#20252b">数据 / 集成</text><polyline points="185,310 185,400" fill="none" stroke="#d8dce0" stroke-width="1" stroke-linejoin="round"/><rect x="48" y="400" width="1504" height="90" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="54" y="432" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#20252b">运营 / 计划</text><polyline points="185,400 185,490" fill="none" stroke="#d8dce0" stroke-width="1" stroke-linejoin="round"/><rect x="48" y="490" width="1504" height="90" fill="#f7f8f9" stroke="#ffffff" stroke-width="1"/><text x="54" y="522" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#20252b">审批 / 管理</text><polyline points="185,490 185,580" fill="none" stroke="#d8dce0" stroke-width="1" stroke-linejoin="round"/><rect x="48" y="580" width="1504" height="90" fill="#ffffff" stroke="#ffffff" stroke-width="1"/><text x="54" y="612" dominant-baseline="text-before-edge" font-family="Hiragino Sans GB,Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="24" font-weight="600" fill="#20252b">仓储 / 物流</text><polyline points="185,580 185,670" fill="none" stroke="#d8dce0" stroke-width="1" stroke-linejoin="round"/><polyline points="198,310 198,670" fill="none" stroke="#e7e9ec" stroke-width="1" stroke-linejoin="round"/><polyline points="367,310 367,670" fill="none" stroke="#e7e9ec" stroke-widt