<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS · 工作空间登录</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#262626;font:14px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:380px;margin:12vh auto;padding:28px}h1{font:italic 600 42px Georgia,serif;margin:0 0 32px}h2{font-size:22px;font-weight:600}p{color:#737373;font-size:12px}label{display:block;margin-top:24px;font-size:12px}input,button{width:100%;padding:12px;border-radius:6px;font:inherit;margin-top:8px}input{border:1px solid #ddd;background:#fafafa}button{background:#262626;color:#fff;border:0;cursor:pointer;margin-top:18px}button:disabled{opacity:.5}input:focus-visible,button:focus-visible{outline:2px solid #2769b1;outline-offset:3px}#status{min-height:36px}small{font-size:11px;color:#737373}hr{border:0;border-top:1px solid #eee;margin:24px 0}.hidden{display:none}
</style></head><body><main><h1>aegis.</h1><section id="signed-out"><h2>进入工作空间</h2><p>使用已绑定的 Google 账号登录。</p><form id="login"><label for="tenant">工作空间标识</label><input id="tenant" required maxlength="64" autocomplete="organization" placeholder="例如 acme"><button id="submit" type="submit">使用 Google 继续</button></form></section><p id="status" role="status" aria-live="polite"></p><hr><small id="mode">正在读取环境配置…</small></main><script>
const $=id=>document.getElementById(id);
async function json(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw Error(d.error?.message||'请求失败');return d}
$('login').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('status').textContent='正在连接 Google…';try{const d=await json('/api/v1/auth/google/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant:$('tenant').value.trim()})});location.assign(d.authorization_url)}catch(e){$('status').textContent=e.message;$('submit').disabled=false}};
(async()=>{try{const p=await json('/api/v1/auth/providers');$('mode').textContent=p.platform_data_mode==='mock'?'平台数据：Mock 仿真环境':'平台数据：真实接口环境';if(!p.google_configured){$('submit').disabled=true;$('status').textContent='管理员尚未配置 Google 登录，请先完成部署配置。'}const r=await fetch('/api/v1/auth/me');if(r.ok){location.replace('/')}}catch(e){$('status').textContent='暂时无法连接服务，请稍后重试。'}})();
</script></body></html>
