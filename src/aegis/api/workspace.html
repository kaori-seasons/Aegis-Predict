<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS · 库存工作空间</title><link rel="stylesheet" href="/workspace-assets/workspace.css?v=__CSS_HASH__"><script defer src="/workspace-assets/decision.js?v=__DECISION_HASH__"></script><script defer src="/workspace-assets/administration.js?v=__ADMIN_HASH__"></script><script defer src="/workspace-assets/workspace.js?v=__JS_HASH__"></script><link rel="stylesheet" href="/workspace-assets/expert.css?v=__EXPERT_CSS_HASH__"><script src="/workspace-assets/expert-manager.js?v=__EXPERT_MANAGER_HASH__" defer></script></head>
<body>
<a class="skip" href="#content">跳至主要内容</a>
<aside class="sidebar"><a class="brand" href="/">aegis.<small>PREDICT</small></a><p class="nav-caption">工作空间</p><nav aria-label="业务导航">
<button data-page="overview" aria-current="page"><span aria-hidden="true">⌂</span>仓网总览</button><button data-page="forecast"><span aria-hidden="true">↗</span>销量预测</button><button data-page="replenishment"><span aria-hidden="true">□</span>补货队列</button><button data-page="allocation"><span aria-hidden="true">⇄</span>分仓方案</button><button data-page="evaluation"><span aria-hidden="true">▥</span>效果评估</button><button data-page="forecastops" data-permission="data:view"><span aria-hidden="true">≋</span>预测与模型</button><button data-page="sources"><span aria-hidden="true">⊕</span>数据源管理</button>
</nav><div class="account"><strong id="tenant-name">正在读取工作空间</strong><small id="member-email"></small><button class="text-button logout" type="button">退出登录</button></div></aside>
<header><h1 id="page-title">仓网总览</h1><div><span id="environment">正在读取数据模式</span><button id="refresh" class="secondary" type="button">刷新</button><button class="text-button logout mobile-only" type="button">退出</button></div></header>
<main id="content" tabindex="-1"><div id="message" class="notice hidden" role="status" aria-live="polite"></div><div id="loading" role="status">正在读取当前租户的数据…</div>
<div id="workspace" class="hidden"><section class="workspace-head"><div><p class="eyebrow">INVENTORY WORKSPACE</p><h2 id="section-title" tabindex="-1">仓网总览</h2><p id="context-label"></p></div><span id="source-badge" class="tag"></span></section>
<section class="plan-toolbar" aria-label="计划选择与生成"><label>当前计划<select id="plan-select"><option value="">暂无计划</option></select></label><span id="plan-status"></span><button id="new-plan" type="button" data-permission="plan:generate">生成计划</button><button id="default-policy" class="secondary hidden" data-permission="policy:edit" type="button">创建默认策略</button></section>
<nav id="management-nav" class="management-tabs hidden" aria-label="管理导航"><button type="button" data-page="sources" data-permission="integration:connection:view">连接与来源</button><button type="button" data-page="reconciliation" data-permission="data:view">对账差异</button><button type="button" data-page="mappings" data-permission="integration:connection:view">主数据映射</button><button type="button" data-page="users" data-permission="user:manage">成员与权限</button><button type="button" data-page="forecastops" data-permission="data:view">预测与模型</button><button type="button" data-page="bundles" data-permission="data:view">套组追溯</button><button type="button" data-page="risks" data-permission="data:view">库存风险</button><button type="button" data-page="experts" data-permission="forecast:expert:manage">新品专家评审</button><button type="button" data-page="commerce" data-permission="data:view">经营信号与新品</button><button type="button" data-page="collaboration" data-permission="data:view">运营协同</button></nav>
<div class="workspace-grid"><div id="page-content" aria-live="polite"></div><aside class="rail"><section><h3>待你处理</h3><strong id="review-count" class="review-total">—</strong><p>条建议待审核</p><button data-page="replenishment" type="button">查看补货队列 →</button></section><section><h3>数据准备情况</h3><p id="readiness-summary">尚未检查</p><ul id="data-blockers"></ul><button class="text-button" data-page="sources" data-permission="integration:connection:view" type="button">管理数据源 →</button></section><section><h3>计划操作</h3><p id="execution-policy"></p><label class="check"><input id="ack-stale" type="checkbox">已核对并接受过期数据风险</label><button id="release-plan" type="button" data-permission="plan:release">发布已批准建议</button><button id="close-plan" class="secondary" type="button" data-permission="plan:release">结算完成，关闭计划</button><button id="discard-plan" class="text-button" type="button" data-permission="plan:adjust">丢弃/取消当前计划</button></section><small>所有页面使用当前租户会话。数据模式和计划状态由服务端校验。</small></aside></div>
</div></main>
<dialog id="new-plan-dialog" aria-labelledby="new-plan-title"><form id="new-plan-form"><div class="dialog-head"><h3 id="new-plan-title">生成补货计划</h3><button class="text-button" type="button" data-close>关闭</button></div><label>周期（天）<input name="horizon_days" type="number" min="1" max="365" value="30" required></label><label>计划模式<select name="mode"><option value="shadow">影子计划 · 只读评估</option><option value="execution">执行计划 · 审核后可发布</option></select></label><label>外部回写连接（可选）<select name="writeback_connection_id" id="writeback-select"><option value="">人工协同，不创建外部单据</option></select></label><p class="muted">执行及外部回写受服务端独立开关控制。</p><button type="submit">提交计算</button></form></dialog>
<dialog id="action-dialog" aria-labelledby="action-title"><form id="action-form"><div class="dialog-head"><h3 id="action-title"></h3><button type="button" class="text-button" data-close>关闭</button></div><div id="action-fields"></div><button type="submit">确认提交</button></form></dialog>
</body></html>
