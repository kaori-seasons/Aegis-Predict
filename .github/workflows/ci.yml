name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegis_owner
          POSTGRES_PASSWORD: test-owner
          POSTGRES_DB: aegis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis_owner -d aegis_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      AEGIS_TEST_ADMIN_DSN: postgresql+psycopg://aegis_owner:test-owner@localhost:5432/aegis_test
      AEGIS_TEST_APP_PASSWORD: test-app
      AEGIS_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --constraint requirements/constraints.txt '.[dev]'
      - run: python -m compileall -q src
      - run: pytest -q
      - run: aegis release-manifest --output /tmp/release-manifest.json
      - run: aegis backtest --max-wape 0.35 --max-bias 0.2 --output /tmp/backtest.json
      - uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: |
            /tmp/backtest.json
            /tmp/release-manifest.json

  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - run: pip install --constraint requirements/constraints.txt cryptography
      - run: docker buildx build --load --platform linux/${{ matrix.architecture }} -t aegis-verify:${{ matrix.architecture }} .
      - run: python scripts/verify_container.py --image aegis-verify:${{ matrix.architecture }} --platform linux/${{ matrix.architecture }} --output /tmp/container-${{ matrix.architecture }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.architecture }}
          path: /tmp/container-${{ matrix.architecture }}.json
