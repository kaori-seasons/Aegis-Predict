[project]
name = "aegis-predict"
version = "0.11.0"
description = "Overseas warehouse replenishment platform for cross-border ecommerce: ERP/market data integration, demand forecasting and allocation planning."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121.1,<1",
  "python-multipart>=0.0.9",
  "scipy>=1.11",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
ml = [
  "lightgbm>=4.3,<5",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.0,<4",
]
dev = [
  "pytest>=8",
  "hypothesis>=6.100",
  "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
aegis = "aegis.cli:main"
globalpool-demo = "overseas_inventory.demo:main"
globalpool-web = "overseas_inventory.competition_web:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "pg: requires a reachable PostgreSQL server (AEGIS_TEST_ADMIN_DSN)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
overseas_inventory = [
  "web_frontend/*.html",
  "web_frontend/assets/*.css",
  "web_frontend/assets/*.js",
  "web_frontend/assets/*.svg",
]
aegis = [
  "api/*.html",
  "api/static/*.css",
  "api/static/*.js",
  "migrations/*.py",
  "migrations/versions/*.py",
  "migrations/script.py.mako",
]
